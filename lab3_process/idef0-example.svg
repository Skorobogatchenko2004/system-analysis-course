<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc">
  <title id="title">Пример IDEF0: обработка обращения в IT-поддержку университета</title>
  <desc id="desc">Контекстная диаграмма A-0 и её декомпозиция A0 на четыре функции: регистрация обращения, диагностика, решение или передача специалисту, ответ студенту.</desc>
  <defs>
    <marker id="arrow-input" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arrow-control" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="arrow-output" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arrow-mechanism" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="arrow-internal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #526078; }
      .panel-title { font-size: 21px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 700; letter-spacing: .5px; }
      .box-text { font-size: 16px; font-weight: 600; }
      .small { font-size: 14px; }
      .tiny { font-size: 13px; }
      .panel { fill: #ffffff; stroke: #d8e0eb; stroke-width: 2; }
      .function { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; rx: 10; }
      .input-box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 8; }
      .control-box { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.5; rx: 8; }
      .output-box { fill: #ecfdf5; stroke: #6ee7b7; stroke-width: 1.5; rx: 8; }
      .mechanism-box { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1.5; rx: 8; }
      .input-line { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-input); }
      .control-line { fill: none; stroke: #d97706; stroke-width: 3; marker-end: url(#arrow-control); }
      .output-line { fill: none; stroke: #059669; stroke-width: 3; marker-end: url(#arrow-output); }
      .mechanism-line { fill: none; stroke: #7c3aed; stroke-width: 3; marker-end: url(#arrow-mechanism); }
      .internal-line { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow-internal); }
    </style>
  </defs>

  <rect width="1400" height="1050" fill="#f3f6fb"/>
  <text x="48" y="43" class="title">Университетская IT-поддержка: пример IDEF0</text>
  <text x="48" y="68" class="subtitle">Одна и та же система показана сначала целиком, затем — через основные функции</text>

  <!-- Context diagram A-0 -->
  <rect x="30" y="88" width="1340" height="320" rx="16" class="panel"/>
  <text x="58" y="125" class="panel-title">Контекст системы · A-0</text>
  <text x="58" y="148" class="subtitle">Одна функция и её связи с окружением</text>

  <rect x="65" y="225" width="250" height="90" class="input-box"/>
  <text x="190" y="258" text-anchor="middle" class="label" fill="#1d4ed8">ВХОДЫ</text>
  <text x="190" y="283" text-anchor="middle" class="small">Обращение студента</text>
  <text x="190" y="303" text-anchor="middle" class="small">Описание проблемы</text>

  <rect x="475" y="177" width="440" height="165" class="function"/>
  <text x="695" y="209" text-anchor="middle" class="label" fill="#1d4ed8">A-0</text>
  <text x="695" y="248" text-anchor="middle" class="box-text">Организовать обработку</text>
  <text x="695" y="273" text-anchor="middle" class="box-text">обращения студента</text>
  <text x="695" y="298" text-anchor="middle" class="box-text">по IT-сервису</text>

  <rect x="475" y="137" width="440" height="30" class="control-box"/>
  <text x="695" y="157" text-anchor="middle" class="small">Управление: правила поддержки, приоритеты (если заданы)</text>
  <path d="M695 167 V177" class="control-line"/>

  <rect x="1070" y="220" width="260" height="100" class="output-box"/>
  <text x="1200" y="251" text-anchor="middle" class="label" fill="#047857">ВЫХОДЫ</text>
  <text x="1200" y="277" text-anchor="middle" class="small">Ответ или решение студенту</text>
  <text x="1200" y="299" text-anchor="middle" class="small">Обновлённая запись</text>

  <rect x="475" y="357" width="440" height="38" class="mechanism-box"/>
  <text x="695" y="382" text-anchor="middle" class="small">Механизмы: оператор, специалист, система учёта обращений</text>

  <path d="M315 270 H475" class="input-line"/>
  <path d="M915 270 H1070" class="output-line"/>
  <path d="M695 357 V342" class="mechanism-line"/>

  <!-- Decomposition A0 -->
  <rect x="30" y="428" width="1340" height="590" rx="16" class="panel"/>
  <text x="58" y="466" class="panel-title">Декомпозиция функции · A0</text>
  <text x="58" y="489" class="subtitle">Те же входы, управление и выходы; внутри показаны четыре связанные функции</text>

  <rect x="440" y="514" width="520" height="54" class="control-box"/>
  <text x="700" y="537" text-anchor="middle" class="label" fill="#b45309">УПРАВЛЕНИЕ</text>
  <text x="700" y="557" text-anchor="middle" class="small">Правила поддержки · приоритеты · условия передачи специалисту</text>
  <path d="M700 568 V604" class="control-line"/>
  <path d="M330 604 H1090" class="control-line"/>
  <path d="M370 604 V632" class="control-line"/>
  <path d="M590 604 V632" class="control-line"/>
  <path d="M810 604 V632" class="control-line"/>
  <path d="M1030 604 V632" class="control-line"/>

  <rect x="55" y="670" width="190" height="112" class="input-box"/>
  <text x="150" y="701" text-anchor="middle" class="label" fill="#1d4ed8">ВХОДЫ</text>
  <text x="150" y="728" text-anchor="middle" class="small">Обращение</text>
  <text x="150" y="750" text-anchor="middle" class="small">и сведения</text>
  <text x="150" y="770" text-anchor="middle" class="small">о проблеме</text>

  <rect x="285" y="632" width="170" height="126" class="function"/>
  <text x="370" y="658" text-anchor="middle" class="label" fill="#1d4ed8">A1</text>
  <text x="370" y="693" text-anchor="middle" class="box-text">Принять и</text>
  <text x="370" y="717" text-anchor="middle" class="box-text">зарегистрировать</text>
  <text x="370" y="741" text-anchor="middle" class="box-text">обращение</text>

  <rect x="505" y="632" width="170" height="126" class="function"/>
  <text x="590" y="658" text-anchor="middle" class="label" fill="#1d4ed8">A2</text>
  <text x="590" y="700" text-anchor="middle" class="box-text">Проверить</text>
  <text x="590" y="724" text-anchor="middle" class="box-text">и определить</text>
  <text x="590" y="748" text-anchor="middle" class="box-text">проблему</text>

  <rect x="725" y="632" width="170" height="126" class="function"/>
  <text x="810" y="658" text-anchor="middle" class="label" fill="#1d4ed8">A3</text>
  <text x="810" y="693" text-anchor="middle" class="box-text">Решить или</text>
  <text x="810" y="717" text-anchor="middle" class="box-text">передать</text>
  <text x="810" y="741" text-anchor="middle" class="box-text">специалисту</text>

  <rect x="945" y="632" width="170" height="126" class="function"/>
  <text x="1030" y="658" text-anchor="middle" class="label" fill="#1d4ed8">A4</text>
  <text x="1030" y="700" text-anchor="middle" class="box-text">Сообщить</text>
  <text x="1030" y="724" text-anchor="middle" class="box-text">результат и</text>
  <text x="1030" y="748" text-anchor="middle" class="box-text">закрыть заявку</text>

  <rect x="1160" y="670" width="190" height="112" class="output-box"/>
  <text x="1255" y="701" text-anchor="middle" class="label" fill="#047857">ВЫХОДЫ</text>
  <text x="1255" y="728" text-anchor="middle" class="small">Ответ студенту</text>
  <text x="1255" y="750" text-anchor="middle" class="small">и запись</text>
  <text x="1255" y="770" text-anchor="middle" class="small">о результате</text>

  <path d="M245 726 H285" class="input-line"/>
  <path d="M455 695 H505" class="internal-line"/>
  <text x="480" y="682" text-anchor="middle" class="tiny">заявка</text>
  <path d="M675 695 H725" class="internal-line"/>
  <text x="700" y="682" text-anchor="middle" class="tiny">диагноз</text>
  <path d="M895 695 H945" class="internal-line"/>
  <text x="920" y="682" text-anchor="middle" class="tiny">решение</text>
  <path d="M1115 726 H1160" class="output-line"/>

  <rect x="285" y="833" width="170" height="72" class="mechanism-box"/>
  <text x="370" y="860" text-anchor="middle" class="label" fill="#6d28d9">МЕХАНИЗМЫ</text>
  <text x="370" y="885" text-anchor="middle" class="tiny">Оператор · система учёта</text>
  <path d="M370 833 V758" class="mechanism-line"/>

  <rect x="505" y="833" width="170" height="72" class="mechanism-box"/>
  <text x="590" y="860" text-anchor="middle" class="label" fill="#6d28d9">МЕХАНИЗМЫ</text>
  <text x="590" y="885" text-anchor="middle" class="tiny">Оператор · сведения о сервисе</text>
  <path d="M590 833 V758" class="mechanism-line"/>

  <rect x="725" y="833" width="170" height="72" class="mechanism-box"/>
  <text x="810" y="860" text-anchor="middle" class="label" fill="#6d28d9">МЕХАНИЗМЫ</text>
  <text x="810" y="885" text-anchor="middle" class="tiny">Оператор · техспециалист</text>
  <path d="M810 833 V758" class="mechanism-line"/>

  <rect x="945" y="833" width="170" height="72" class="mechanism-box"/>
  <text x="1030" y="860" text-anchor="middle" class="label" fill="#6d28d9">МЕХАНИЗМЫ</text>
  <text x="1030" y="885" text-anchor="middle" class="tiny">Оператор · система учёта</text>
  <path d="M1030 833 V758" class="mechanism-line"/>

  <line x1="60" y1="951" x2="105" y2="951" class="input-line"/>
  <text x="115" y="956" class="tiny">вход</text>
  <line x1="205" y1="951" x2="250" y2="951" class="control-line"/>
  <text x="260" y="956" class="tiny">управление</text>
  <line x1="385" y1="951" x2="430" y2="951" class="output-line"/>
  <text x="440" y="956" class="tiny">выход</text>
  <line x1="535" y1="951" x2="580" y2="951" class="mechanism-line"/>
  <text x="590" y="956" class="tiny">механизм</text>
  <line x1="690" y1="951" x2="735" y2="951" class="internal-line"/>
  <text x="745" y="956" class="tiny">передача между функциями</text>
  <text x="60" y="990" class="subtitle">Состав функций и стрелок в реальной работе нужно подтвердить наблюдениями; схема показывает только учебный пример.</text>
</svg>
